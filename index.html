<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İlknur Bank — Ana Sayfa</title>
<link rel="stylesheet" href="style.css">
<script>
function applyTheme() {
  if (localStorage.getItem("tema") === "koyu") document.body.classList.add("dark");
}
function init() {
  applyTheme();
  var user = localStorage.getItem("bank_user") || "Misafir";
  document.getElementById("welcome").textContent = "Hoş geldin, " + user;
  if (!localStorage.getItem("bakiye")) localStorage.setItem("bakiye", "25750");
  document.getElementById("bakiye").textContent =
    Number(localStorage.getItem("bakiye")).toLocaleString("tr-TR", {minimumFractionDigits: 2}) + " ₺";
}
function cikis() {
  localStorage.removeItem("bank_user");
  window.location.href = "login.html";
}
window.onload = init;
</script>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="brand-mark">İB</div><span>İlknur Bank</span></div>
  <div class="topbar-actions">
    <a href="ayarlar.html">⚙️ Ayarlar</a>
    <button class="link" onclick="cikis()">Çıkış Yap</button>
  </div>
</div>

<div class="container">
  <h1 id="welcome">Hoş geldin</h1>

  <div class="balance-card">
    <div>
      <small>Vadesiz Hesap • TR12 0000 0000 0000 0000 0000 01</small>
      <div class="balance-amount" id="bakiye">—</div>
      <div class="balance-iban">Kullanılabilir bakiye</div>
    </div>
    <div><a href="hesap-ozeti.html" style="background:#fff;color:#12315e;text-decoration:none;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px">Hesabı Gör</a></div>
  </div>

  <div class="menu">
    <a href="transfer.html"><div class="card"><div class="icon">💸</div><strong>Para Transferi</strong><span>Havale / EFT gönder</span></div></a>
    <a href="fatura.html"><div class="card"><div class="icon">🧾</div><strong>Fatura Ödeme</strong><span>Elektrik, su, telefon</span></div></a>
    <a href="hesap-ozeti.html"><div class="card"><div class="icon">📊</div><strong>Hesap Özeti</strong><span>Son hareketler</span></div></a>
    <a href="kart-islemleri.html"><div class="card"><div class="icon">💳</div><strong>Kart İşlemleri</strong><span>Limit, borç, ekstere</span></div></a>
  </div>
</div>
<script src="gecis.js" defer></script>
</body>
</html>
