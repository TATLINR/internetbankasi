<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Bank — Giriş</title>
<link rel="stylesheet" href="style.css">
<script>
function girisKontrol(e) {
  if (e) e.preventDefault();
  var kadi = document.getElementById("kadi").value.trim();
  var sifre = document.getElementById("sifre").value;
  var msg = document.getElementById("msg");
  if (kadi === "kullanıcı" && sifre === "010101") {
    localStorage.setItem("bank_user", kadi);
    window.location.href = "index.html";
  } else {
    msg.className = "alert err";
    msg.textContent = "Giriş yapılamadı. Kullanıcı adı veya şifre hatalı.";
  }
  return false;
}
</script>
</head>
<body>
<div class="login-wrap">
  <form class="login-box" onsubmit="return girisKontrol(event)">
    <div style="font-size:40px">🏦</div>
    <h2>Web Bank</h2>
    <p>İnternet Bankacılığına hoş geldiniz</p>
    <label for="kadi">Kullanıcı Adı</label>
    <input type="text" id="kadi" placeholder="örn. kullanıcı" autocomplete="username">
    <label for="sifre">Şifre</label>
    <input type="password" id="sifre" placeholder="••••••" autocomplete="current-password">
    <button class="primary" type="submit">Giriş Yap</button>
    <div id="msg" class="alert"></div>
    <div class="demo-info">Demo giriş: <b>kullanıcı</b> / <b>010101</b></div>
  </form>
</div>
<script src="gecis.js" defer></script>
</body>
</html>
